views:
  - title: Feyree EV
    path: feyree-ev
    badges: []
    cards:
      # Status Header
      - type: custom:mushroom-template-card
        primary: >
          {% set s = states('sensor.estado_conexion') %}
          {% if s == 'charging' %} Charging
          {% elif s == 'scheduled' %} Scheduled
          {% elif s == 'no_connet' %} Disconnected
          {% else %} {{ s }}
          {% endif %}
        secondary: '{{ states("sensor.estado_conexion") }}'
        icon: >
          {% set s = states('sensor.estado_conexion') %}
          {% if s == 'charging' %} mdi:ev-station
          {% elif s == 'scheduled' %} mdi:calendar-clock
          {% else %} mdi:ev-plug-type2
          {% endif %}
        icon_color: >
          {% set s = states('sensor.estado_conexion') %}
          {% if s == 'charging' %} green
          {% elif s == 'scheduled' %} blue
          {% else %} amber
          {% endif %}
        tap_action:
          action: more-info
          entity: sensor.estado_conexion

      # Stats Grid
      - type: grid
        columns: 2
        square: false
        cards:
          # Left Column
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                primary: '{{ states("sensor.potencia_carga") }} kW'
                secondary: Power
                icon: mdi:lightning-bolt
                icon_color: yellow
              - type: custom:mushroom-template-card
                primary: '{{ states("sensor.corriente_carga_fase_1") }} A'
                secondary: Current
                icon: mdi:current-ac
                icon_color: blue
              - type: custom:mushroom-template-card
                primary: '{{ states("sensor.voltaje") }} V'
                secondary: Voltage
                icon: mdi:sine-wave
                icon_color: purple

          # Right Column
          - type: vertical-stack
            cards:
              - type: custom:mushroom-template-card
                primary: '{{ states("sensor.energia_cargada") }} kWh'
                secondary: Energy
                icon: mdi:battery-charging
                icon_color: green
              - type: custom:mushroom-template-card
                primary: '{{ states("sensor.corriente_2") }} °C'
                secondary: Temp
                icon: mdi:thermometer
                icon_color: >
                  {% set t = states('sensor.corriente_2')|float(0) %}
                  {% if t > 45 %} red
                  {% elif t > 30 %} amber
                  {% else %} green
                  {% endif %}
              - type: custom:mushroom-template-card
                primary: '{{ states("number.corriente_maxima") }} A'
                secondary: Max Current
                icon: mdi:current-dc
                icon_color: amber

      # Preset Current Slider
      - type: custom:mushroom-number-card
        entity: number.corriente_preset
        name: Preset Current
        icon: mdi:current-dc
        display_mode: slider
        min: 6
        max: 32
        step: 1
        icon_color: green

      # Charge Enable Switch
      - type: custom:mushroom-entity-card
        entity: switch.charge_enable
        name: Charge Enable
        icon: mdi:power-plug
        icon_color: >
          {% if is_state('switch.charge_enable', 'on') %} green
          {% else %} grey
          {% endif %}

      # Fault Code
      - type: custom:mushroom-template-card
        primary: >
          {% set f = states('sensor.fault_code')|int(0) %}
          {% if f == 0 %} No faults
          {% else %} Fault {{ f }}
          {% endif %}
        secondary: Fault Code
        icon: mdi:alert-circle
        icon_color: >
          {% set f = states('sensor.fault_code')|int(0) %}
          {% if f == 0 %} green
          {% else %} red
          {% endif %}
